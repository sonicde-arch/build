name: Build Package

on:
  workflow_call:
    inputs:
      repository:
        description: |-
          Location of the GitHub repository containing the package descriptions
          in the form of [HOST/]OWNER/REPO.
        type: string
        default: ${{ vars.PKGSPECS_REPO }}
      branch:
        description: The branch to build
        type: string
        required: true
      package:
        description: |-
          The name of the package to build. Must be a subdirectory of the repository.
        type: string
        required: true
      packager:
        type: string
        description: >
          The builder of the packages in the form of a name and an email address in
          the form of John Doe <john@example.com>
        default: ${{ vars.PACKAGER }}
      docker-image:
        description: The name of the docker image to use
        type: string
        default: ${{ vars.DOCKER_IMAGE }}

      # App-based authentication
      app-id:
        description: GitHub App Client ID
        type: string
        default: ${{ vars.APP_CLIENT_ID }}

      # PGP key handling
      pgp-key:
        description: PGP key file to use for verifying packages
        type: string
        default: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
    secrets:
      APP_PRIVATE_KEY:
        description: GitHub App private key
      RELEASE_SIGNING_KEY:
        description: The OpenPGP key to sign the packages
      RELEASE_SIGNING_KEY_PASSWORD:
        description: The password of the signing key

defaults:
  run:
    shell: sh

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build-package:
    runs-on: ubuntu-24.04
    steps:
      - name: Setup workspace
        uses: callmetango/setup-workspace@HEAD
        with:
          inputs: ${{ toJSON(inputs) }}
          vars: ${{ toJSON(vars) }}

      - name: Setup package build
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          . setup-build-env.sh
          setup-arch-build.sh "$BINPKGS_REPO" "$STAGING_TAG" "$PACKAGE"

      - name: Build package
        run: |
          build-arch-package.sh "$PACKAGE"

      - name: Sign package
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_SIGNING_KEY_PASSWORD }}
        run: |
          sign-packages.sh "$BINPKGS_DIR" "$SIGNING_KEY" \
              "$SIGNING_KEY_PASSWORD"

      - name: Add package to release
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          . setup-build-env.sh # reauthenticate
          add-package-to-release.sh "$BINPKGS_REPO" "$STAGING_TAG" "$PACKAGE"
