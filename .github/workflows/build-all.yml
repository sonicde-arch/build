name: Build All and Publish

on:
  workflow_dispatch:
    inputs:
      force-build:
        description: Force the build of all packages
        type: boolean
        default: false
      branch:
        description: The branch to build
        type: choice
        options:
          - beta
          - master
        default: master

env:
  CARCH: x86_64

jobs:
  _setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/draft-release
        with:
          branch: ${{ inputs.branch }}
          force-build: ${{ inputs.force-build }}
          app-client-id: ${{ vars.APP_CLIENT_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}

  sonic-activities:
    uses: ./.github/workflows/build-package.yml
    needs:
      - _setup
      - sonic-frameworks-cmake-modules
      - sonic-frameworks-core-addons
    with:
      package: sonic-activities
      branch: ${{ inputs.branch }}
      force-build: ${{ inputs.force-build }}
    secrets: inherit

  sonic-audio-applet-pulse:
    uses: ./.github/workflows/build-package.yml
    needs:
      - _setup
      - sonic-frameworks-cmake-modules
      - sonic-frameworks-core-addons
      - sonic-frameworks-doctools
      - sonic-frameworks-keybind
      - sonic-frameworks-quick-ui
      - sonic-interface-libraries
      - sonic-workspace
    with:
      package: sonic-audio-applet-pulse
      branch: ${{ inputs.branch }}
      force-build: ${{ inputs.force-build }}
    secrets: inherit

  sonic-decoration:
    uses: ./.github/workflows/build-package.yml
    needs:
      - _setup
      - sonic-frameworks-cmake-modules
    with:
      package: sonic-decoration
      branch: ${{ inputs.branch }}
      force-build: ${{ inputs.force-build }}
    secrets: inherit

  sonic-desktop-interface:
    uses: ./.github/workflows/build-package.yml
    needs:
      - _setup
      - sonic-activities
      - sonic-frameworks-auth
      - sonic-frameworks-cmake-modules
      - sonic-frameworks-core-addons
      - sonic-frameworks-doctools
      - sonic-frameworks-gui-addons
      - sonic-frameworks-io
      - sonic-frameworks-keybind
      - sonic-frameworks-open-collab
      - sonic-frameworks-quick-ui
      - sonic-frameworks-runner
      - sonic-frameworks-windowsystem
      - sonic-interface-libraries
      - sonic-system-monitor-library
      - sonic-win
      - sonic-workspace
    with:
      package: sonic-desktop-interface
      branch: ${{ inputs.branch }}
      force-build: ${{ inputs.force-build }}
    secrets: inherit

  sonic-frameworks-auth:
    uses: ./.github/workflows/build-package.yml
